openapi: 3.0.3
info:
  title: PharmAssist Gateway API
  version: 1.0.0
  description: |
    Public contract of the PharmAssist API gateway (plan section 9.2), with the overrides in CLAUDE.md:
    no SOAP and no prescription-verification service; prescription OCR (`POST /prescriptions/ocr`) and the
    XML/JSON inventory feed are Tier 0; distance comes from OSRM.

    **Envelope.** Every response uses `{ status, service, request_id, data, error, warnings }`.
    On success `error` is null; on error `data` is null and `error` is `{ code, message, details }`.
    `request_id` is also returned in the `X-Request-Id` header; a client may send its own `X-Request-Id`.
    The single exception is the successful image stream of `GET /reservations/{id}/prescription`
    (a binary file); its errors still use the envelope.
    Where the plan listed 202/204 (logout, forgot-password) the contract returns an envelope with `data: null`.

    **Tiers.** `x-tier` follows plan section 19: 0 = demo-critical, 1 = strongly desired, 2 = only if time remains.
    **Roles.** `x-roles` lists who may call the endpoint (`public` = no login). The gateway checks the role and the
    owning services re-check it. Roles: customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo.

    **Conventions.** Lowercase plural nouns, ISO-8601 UTC timestamps, money as decimal strings,
    lists return `data.items` and `data.meta` (`page`, `per_page` max 100).
servers:
  - url: http://localhost:8000/api/v1
    description: Local gateway
tags:
  - { name: auth, description: 'Accounts, login, approval and staff' }
  - { name: catalog, description: 'Medicines, counseling and branches' }
  - { name: inventory, description: 'Branch stock, alerts and reports' }
  - { name: availability, description: Stock plus distance mashup }
  - { name: reservations, description: 'Reservations, notifications and messages' }
  - { name: prescriptions, description: Prescription image to text (OCR) }
  - { name: integrations, description: Legacy feed intake }
  - { name: health, description: Health }

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [auth]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: Register a customer account (starts as pending approval)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, password, first_name, last_name, contact_no, id_photo]
              properties:
                email: { type: string, format: email, maxLength: 255, description: Must be unique. }
                password: { type: string, format: password, minLength: 8, description: Minimum 8 characters with letters and digits. }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                contact_no: { type: string, pattern: '^[0-9+\- ]{7,20}$' }
                id_photo: { type: string, format: binary, description: 'JPG or PNG, max 2 MB. Stored privately and purged after the CEO decision.' }
      responses:
        '201': { description: Created (verification code emailed)., content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: Confirm the emailed 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$', description: Must not be expired or used. }
      responses:
        '200': { $ref: '#/components/responses/OkNoData' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: Log in and receive a JWT
      description: Wrong email or password returns a generic 401 (no user enumeration). 403 codes - `EMAIL_NOT_VERIFIED`, `ACCOUNT_PENDING`, `ACCOUNT_REJECTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Authenticated., content: { application/json: { schema: { $ref: '#/components/schemas/LoginEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-tier: 0
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
      summary: Invalidate the current token
      responses:
        '200': { $ref: '#/components/responses/OkNoData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      x-tier: 0
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
      summary: Current user
      responses:
        '200': { description: The authenticated user., content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      x-tier: 1
      x-roles: [public]
      security: []
      summary: Send a password reset link (always answers the same, no enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { $ref: '#/components/responses/OkNoData' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      x-tier: 1
      x-roles: [public]
      security: []
      summary: Set a new password using the emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: Must be valid and unused. }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/OkNoData' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/pending:
    get:
      operationId: listPendingUsers
      tags: [auth]
      x-tier: 1
      x-roles: [ceo]
      summary: ID-verification queue
      parameters:
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Accounts waiting for a decision., content: { application/json: { schema: { $ref: '#/components/schemas/UserListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/verification:
    patch:
      operationId: decideUserVerification
      tags: [auth]
      x-tier: 1
      x-roles: [ceo]
      summary: Approve or reject a customer account
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string, maxLength: 500, description: Required when the decision is rejected. }
      responses:
        '200': { description: Updated user (ID image purged)., content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /staff:
    get:
      operationId: listStaff
      tags: [auth]
      x-tier: 2
      x-roles: [branch_manager, ceo]
      summary: List staff (a manager sees only their own branch)
      parameters:
        - { name: branch_id, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Staff accounts., content: { application/json: { schema: { $ref: '#/components/schemas/UserListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createStaff
      tags: [auth]
      x-tier: 2
      x-roles: [branch_manager, ceo]
      summary: Create a staff account (a manager only for their own branch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, role, branch_id]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                contact_no: { type: string }
                role: { type: string, enum: [pharmacy_technician, pharmacy_assistant, branch_manager] }
                branch_id: { type: integer, minimum: 1 }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------ catalog
  /medicines:
    get:
      operationId: searchMedicines
      tags: [catalog]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: Search the medicine catalog (generic or brand name)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: rx, in: query, schema: { type: boolean }, description: Filter by prescription required. }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Matching medicines., content: { application/json: { schema: { $ref: '#/components/schemas/MedicineListEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /medicines/{id}:
    get:
      operationId: getMedicine
      tags: [catalog]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: Medicine detail
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { description: The medicine., content: { application/json: { schema: { $ref: '#/components/schemas/MedicineEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /medicines/{id}/counseling:
    get:
      operationId: getMedicineCounseling
      tags: [catalog]
      x-tier: 1
      x-roles: [public]
      security: []
      summary: Plain-language guidance (internal data combined with openFDA)
      description: If openFDA is unavailable the answer still returns 200 from internal data, `source` is `internal` and `warnings` contains `OPENFDA_UNAVAILABLE`.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { description: Counseling text., content: { application/json: { schema: { $ref: '#/components/schemas/CounselingEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /branches:
    get:
      operationId: listBranches
      tags: [catalog]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: List branches
      responses:
        '200': { description: Branches., content: { application/json: { schema: { $ref: '#/components/schemas/BranchListEnvelope' } } } }
    post:
      operationId: createBranch
      tags: [catalog]
      x-tier: 1
      x-roles: [ceo]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/BranchEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /branches/{id}:
    put:
      operationId: replaceBranch
      tags: [catalog]
      x-tier: 1
      x-roles: [ceo]
      summary: Replace a branch record
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/BranchEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      operationId: updateBranch
      tags: [catalog]
      x-tier: 1
      x-roles: [ceo]
      summary: Partially update or deactivate a branch
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchPatch' }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/BranchEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------ inventory
  /branches/{id}/inventory:
    get:
      operationId: getBranchInventory
      tags: [inventory]
      x-tier: 0
      x-roles: [pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
      summary: Stock of one branch (staff only for their own branch)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: status, in: query, schema: { type: string, enum: [available, low_stock, out_of_stock] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Inventory rows., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /branches/{id}/inventory/{medicineId}:
    put:
      operationId: updateBranchInventory
      tags: [inventory]
      x-tier: 0
      x-roles: [pharmacy_technician, branch_manager]
      summary: Update stock, price or threshold of one medicine at a branch
      description: '`version` is the optimistic-lock value from the last read; a stale value returns 409 `STALE_VERSION`.'
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: medicineId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity, price]
              properties:
                stock_quantity: { type: integer, minimum: 0 }
                price: { type: string, example: '12.50', description: 'Decimal greater than 0.' }
                min_threshold: { type: integer, minimum: 0 }
                batch_no: { type: string, maxLength: 50 }
                expiration_date: { type: string, format: date, description: Must be in the future. }
                version: { type: integer, description: Required when updating an existing row. }
      responses:
        '200': { description: Updated row., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /stock-alerts:
    get:
      operationId: listStockAlerts
      tags: [inventory]
      x-tier: 1
      x-roles: [pharmacy_technician, branch_manager, ceo]
      summary: Low-stock alerts
      parameters:
        - { name: branch_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: resolved, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Alerts., content: { application/json: { schema: { $ref: '#/components/schemas/StockAlertListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/branch-summary:
    get:
      operationId: getBranchSummary
      tags: [inventory]
      x-tier: 1
      x-roles: [pharmacy_assistant, branch_manager, ceo]
      summary: Branch KPIs
      parameters:
        - { name: branch_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date }, description: Range must not exceed 366 days. }
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/ReportEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /reports/system-summary:
    get:
      operationId: getSystemSummary
      tags: [inventory]
      x-tier: 1
      x-roles: [ceo]
      summary: All-branch KPIs
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Summary., content: { application/json: { schema: { $ref: '#/components/schemas/ReportEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------ availability
  /availability:
    get:
      operationId: getAvailability
      tags: [availability]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: Branches with stock, ranked by travel time (mashup of inventory and OSRM)
      description: |
        Needs `medicine_id` or `q`. With `lat` and `lng` the list is ranked by `travel_minutes`, then price.
        If OSRM fails the call still returns 200 with straight-line estimates,
        `distance_source` is `haversine_fallback` and `warnings` has `DISTANCE_FALLBACK`.
      parameters:
        - { name: medicine_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200': { description: Ranked branches (may be empty)., content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------ reservations
  /reservations:
    post:
      operationId: createReservation
      tags: [reservations]
      x-tier: 0
      x-roles: [customer]
      summary: Create a reservation (holds stock)
      description: |
        Core transaction: reservation-service holds stock through inventory-service, stores the reservation
        and queues notifications. A prescription image is required when any item needs a prescription and
        optional otherwise; if sent, OCR runs and the response carries `ocr_text` and `ocr_status`.
        If OCR is unavailable the reservation still succeeds with `ocr_status: unavailable` and a warning.
        Replaying the same `Idempotency-Key` and body returns the original reservation (200);
        the same key with a different body is 409 `DUPLICATE_REQUEST`.
        Other 409: `STOCK_INSUFFICIENT` (details.available).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [branch_id, items]
              properties:
                branch_id: { type: integer, minimum: 1, description: Must be an active branch. }
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/ReservationItemInput' }
                notes: { type: string, maxLength: 500 }
                prescription: { type: string, format: binary, description: 'JPG or PNG, max 4 MB.' }
            encoding:
              items: { contentType: application/json }
          application/json:
            schema:
              type: object
              required: [branch_id, items]
              properties:
                branch_id: { type: integer, minimum: 1 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/ReservationItemInput' }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Created. Contains the claim code and expiry., content: { application/json: { schema: { $ref: '#/components/schemas/ReservationEnvelope' } } } }
        '200': { description: Idempotent replay of an earlier request., content: { application/json: { schema: { $ref: '#/components/schemas/ReservationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      operationId: listReservations
      tags: [reservations]
      x-tier: 0
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
      summary: List reservations (customer - own, staff - own branch, CEO - all)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReservationStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Reservations., content: { application/json: { schema: { $ref: '#/components/schemas/ReservationListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      x-tier: 0
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
      summary: Reservation detail (owner, staff of the branch or CEO)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { description: The reservation., content: { application/json: { schema: { $ref: '#/components/schemas/ReservationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{id}/status:
    patch:
      operationId: changeReservationStatus
      tags: [reservations]
      x-tier: 0
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager]
      summary: Change reservation status
      description: |
        `cancel` - owning customer; `approve` and `reject` - technician or manager of the branch (staff review the
        prescription image and `ocr_text` first); `complete` (needs the correct `claim_code`) - technician, assistant or manager.
        Invalid moves return 409 `INVALID_TRANSITION`. Reject, cancel and expiry release the held stock; complete commits it.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject, cancel, complete] }
                reason: { type: string, maxLength: 500, description: Required for reject. }
                claim_code: { type: string, description: Required for complete. }
      responses:
        '200': { description: Updated reservation., content: { application/json: { schema: { $ref: '#/components/schemas/ReservationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /reservations/{id}/prescription:
    get:
      operationId: getReservationPrescription
      tags: [reservations]
      x-tier: 0
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager]
      summary: Stream the stored prescription image (private, never a public URL)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The image file (the only non-envelope success response).
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      operationId: listNotifications
      tags: [reservations]
      x-tier: 1
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
      summary: Own notifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Notifications., content: { application/json: { schema: { $ref: '#/components/schemas/NotificationListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [reservations]
      x-tier: 1
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
      summary: Mark a notification as read (owner only)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/NotificationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages:
    get:
      operationId: listMessages
      tags: [reservations]
      x-tier: 2
      x-roles: [customer, branch_manager, ceo]
      summary: List own message threads (plan lists only "/messages*"; shape here is proposed)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Messages., content: { application/json: { schema: { $ref: '#/components/schemas/MessageListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: sendMessage
      tags: [reservations]
      x-tier: 2
      x-roles: [customer, branch_manager]
      summary: Customer to branch, or branch manager to CEO (proposed shape)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                branch_id: { type: integer, minimum: 1, description: Target branch when a customer writes. Omit when a manager writes to the CEO. }
                subject: { type: string, maxLength: 150 }
                body: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Sent., content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------ prescriptions
  /prescriptions/ocr:
    post:
      operationId: ocrPrescription
      tags: [prescriptions]
      x-tier: 0
      x-roles: [customer, pharmacy_technician, pharmacy_assistant, branch_manager]
      summary: Read a prescription image into text (nothing is stored)
      description: |
        Gateway to integration-service OCR adapter. The text is a reading aid, not a verification;
        staff still review the image. If OCR is down the answer is 200 with `ocr_status: unavailable`,
        `ocr_text: null` and the warning `OCR_UNAVAILABLE` so the client can offer manual entry.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'JPG or PNG, max 4 MB.' }
      responses:
        '200': { description: OCR result., content: { application/json: { schema: { $ref: '#/components/schemas/OcrEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /scans/medicine:
    post:
      operationId: scanMedicinePackage
      tags: [prescriptions]
      x-tier: 2
      x-roles: [public]
      security: []
      summary: Read a medicine package photo and suggest matching catalog entries
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'JPG or PNG, max 4 MB.' }
      responses:
        '200': { description: Text and candidate medicines., content: { application/json: { schema: { $ref: '#/components/schemas/ScanEnvelope' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------ integrations
  /integrations/inventory/sync:
    post:
      operationId: syncInventoryFeed
      tags: [integrations]
      x-tier: 0
      x-roles: [branch_manager, ceo]
      summary: Import a branch inventory feed (XML or JSON)
      description: |
        Simulates a legacy branch system pushing stock. The gateway forwards the raw body to integration-service
        (Message Translator: XML is checked against `inventory-feed.xsd` and turned into normalised JSON), checks the
        branch scope, then inventory-service applies it. A branch manager may only sync the branch in their token;
        the CEO may sync any branch. Medicines are matched by natural key (generic name, brand name, strength, dosage
        form; case-insensitive) and are never created. Values are absolute, so sending the same feed twice changes
        nothing the second time.

        With `strict=true` one rejected row rolls back the whole feed (422 `FEED_REJECTED`); otherwise good rows are
        applied and rejected rows are listed in `errors`. Row codes: `UNKNOWN_MEDICINE`, `INVALID_QUANTITY`,
        `INVALID_PRICE`, `PAST_EXPIRATION`, `BELOW_RESERVED`, `DUPLICATE_ITEM`, `INVALID_BATCH_NO`,
        `INVALID_MIN_THRESHOLD`.

        A malformed or XSD-invalid feed is 400 (`MALFORMED_XML` or `MALFORMED_JSON`, with at most 10 short messages in `error.details.errors`).

        Limits: 512 KB, 500 items, UTF-8 only, no DOCTYPE or ENTITY declarations. 5 requests per minute per IP.
      parameters:
        - { name: strict, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/xml:
            schema: { $ref: '#/components/schemas/InventoryFeedXml' }
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <inventoryFeed branchId="1" generatedAt="2026-10-24T08:00:00+08:00">
                <item>
                  <genericName>Amoxicillin</genericName>
                  <brandName></brandName>
                  <strength>500mg</strength>
                  <dosageForm>Capsule</dosageForm>
                  <quantity>120</quantity>
                  <price>12.50</price>
                  <batchNo>B-2026-014</batchNo>
                  <expirationDate>2027-06-30</expirationDate>
                  <minThreshold>20</minThreshold>
                </item>
              </inventoryFeed>
          text/xml:
            schema: { $ref: '#/components/schemas/InventoryFeedXml' }
          application/json:
            schema: { $ref: '#/components/schemas/InventoryFeedJson' }
      responses:
        '200': { description: Processed (possibly with rejected rows when strict is false)., content: { application/json: { schema: { $ref: '#/components/schemas/FeedResultEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: '`strict=true` and at least one row was rejected (`FEED_REJECTED`; nothing was applied), or the body shape is wrong (`VALIDATION_FAILED`).'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # ------------------------------------------------------------------ health
  /health:
    get:
      operationId: getHealth
      tags: [health]
      x-tier: 0
      x-roles: [public]
      security: []
      summary: Aggregated health of the gateway and its services
      responses:
        '200': { description: All components up., content: { application/json: { schema: { $ref: '#/components/schemas/HealthEnvelope' } } } }
        '503':
          description: At least one component is down (`SERVICE_UNAVAILABLE`); `error.details` lists them.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by login (HS256, 60 min; claims sub, role, branch_id, jti). 401 means not authenticated; 403 means not allowed for this role or branch.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Status:
      name: status
      in: query
      schema: { type: string, enum: [pending, approved, rejected], default: pending }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique value (for example a UUID) per reservation attempt.
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    OkNoData:
      description: Success without a payload (`data` is null).
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    BadRequest:
      description: Malformed body (`MALFORMED_REQUEST`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Missing, invalid or expired token, or wrong credentials (`UNAUTHENTICATED`, `TOKEN_EXPIRED`, `INVALID_CREDENTIALS`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Role or branch not allowed, or account state blocks it (`FORBIDDEN`, `ACCOUNT_PENDING`, `EMAIL_NOT_VERIFIED`, `ACCOUNT_REJECTED`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Record does not exist (`NOT_FOUND`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: 'State or uniqueness conflict (`CONFLICT`, `STOCK_INSUFFICIENT`, `DUPLICATE_REQUEST`, `INVALID_TRANSITION`, `STALE_VERSION`).'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Gone:
      description: Code or token expired or already used (`CODE_EXPIRED`, `TOKEN_EXPIRED`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: File too large (`PAYLOAD_TOO_LARGE`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnsupportedMediaType:
      description: Unsupported content or file type (`UNSUPPORTED_MEDIA_TYPE`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationFailed:
      description: Invalid input (`VALIDATION_FAILED`); `error.details` maps field names to messages.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: Rate limit hit (`TOO_MANY_REQUESTS`).
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: A dependency is unavailable or timed out (`SERVICE_UNAVAILABLE`, `UPSTREAM_TIMEOUT`); critical steps fail closed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    Error:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string, example: STOCK_INSUFFICIENT }
        message: { type: string, example: Only 2 left at this branch. }
        details: { type: object, nullable: true, additionalProperties: true, description: 'Field-to-messages map, or extra context.', example: { available: 2 } }
    Envelope:
      type: object
      required: [status, service, request_id, data, error, warnings]
      properties:
        status: { type: integer, example: 200 }
        service: { type: string, example: gateway }
        request_id: { type: string, example: 3f0c2d1e-8a4b-4a52-9b7e-1d6a5f0c9e11 }
        data: { type: object, nullable: true }
        error: { type: object, nullable: true }
        warnings:
          type: array
          items: { type: string, example: DISTANCE_FALLBACK }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            status: { type: integer, minimum: 400, example: 409 }
            data: { type: object, nullable: true, example: null }
            error: { $ref: '#/components/schemas/Error' }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    # ---- domain objects
    Role:
      type: string
      enum: [customer, pharmacy_technician, pharmacy_assistant, branch_manager, ceo]
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        contact_no: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branch_id: { type: integer, nullable: true, description: Reference to a branch in inventory-service (no foreign key). }
        email_verified: { type: boolean }
        verification_status: { type: string, enum: [pending, approved, rejected] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    Medicine:
      type: object
      properties:
        id: { type: integer }
        generic_name: { type: string, example: Amoxicillin }
        brand_name: { type: string, nullable: true, example: Amoxil }
        category: { type: string }
        strength: { type: string, example: 500mg }
        dosage_form: { type: string, example: Capsule }
        prescription_required: { type: boolean }
        image_url: { type: string, nullable: true }
    Counseling:
      type: object
      properties:
        medicine_id: { type: integer }
        summary: { type: string }
        how_to_use: { type: string, nullable: true }
        warnings: { type: string, nullable: true }
        source: { type: string, enum: [openfda, internal] }
    BranchInput:
      type: object
      required: [name, address, latitude, longitude]
      properties:
        name: { type: string, maxLength: 150, description: Must be unique. }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        contact_no: { type: string }
        opening_hours: { type: string }
        is_active: { type: boolean }
    BranchPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 150 }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        contact_no: { type: string }
        opening_hours: { type: string }
        is_active: { type: boolean }
    Branch:
      allOf:
        - $ref: '#/components/schemas/BranchInput'
        - type: object
          properties:
            id: { type: integer }
    InventoryItem:
      type: object
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        medicine: { $ref: '#/components/schemas/Medicine' }
        price: { type: string, example: '12.50' }
        stock_quantity: { type: integer }
        reserved_quantity: { type: integer }
        available_quantity: { type: integer, description: stock_quantity minus reserved_quantity. }
        min_threshold: { type: integer }
        batch_no: { type: string, nullable: true }
        expiration_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [available, low_stock, out_of_stock] }
        version: { type: integer }
    StockAlert:
      type: object
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        medicine: { $ref: '#/components/schemas/Medicine' }
        alert_type: { type: string, enum: [low_stock, critical_stock, out_of_stock] }
        current_stock: { type: integer }
        is_resolved: { type: boolean }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
    Report:
      type: object
      properties:
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        branch_id: { type: integer, nullable: true, description: Null for the system summary. }
        reservations_by_status:
          type: object
          additionalProperties: { type: integer }
        low_stock_count: { type: integer }
        top_medicines:
          type: array
          items:
            type: object
            properties:
              medicine_id: { type: integer }
              generic_name: { type: string }
              reserved_quantity: { type: integer }
    AvailabilityItem:
      type: object
      properties:
        branch: { $ref: '#/components/schemas/Branch' }
        medicine: { $ref: '#/components/schemas/Medicine' }
        price: { type: string }
        available_quantity: { type: integer }
        distance_km: { type: number, nullable: true }
        travel_minutes: { type: number, nullable: true }
        distance_source: { type: string, nullable: true, enum: [osrm, haversine_fallback] }
    ReservationStatus:
      type: string
      enum: [pending, approved, completed, rejected, cancelled, expired]
    ReservationItemInput:
      type: object
      required: [medicine_id, quantity]
      properties:
        medicine_id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    ReservationItem:
      type: object
      properties:
        medicine_id: { type: integer }
        medicine_name: { type: string, description: Snapshot at reservation time. }
        unit_price: { type: string, description: Snapshot at reservation time. }
        quantity: { type: integer }
    OcrStatus:
      type: string
      enum: [success, low_confidence, unavailable]
    Reservation:
      type: object
      properties:
        id: { type: integer }
        claim_code: { type: string, example: PA-7K3Q9X2M, description: 'Random, non-guessable. Visible to the owner and staff of the branch only.' }
        user_id: { type: integer }
        branch_id: { type: integer }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        prescription_uploaded: { type: boolean }
        ocr_text: { type: string, nullable: true, description: 'Text read from the prescription image; a reading aid, not verification.' }
        ocr_status: { type: string, nullable: true, enum: [success, low_confidence, unavailable, null], description: Null when no image was sent. }
        items: { type: array, items: { $ref: '#/components/schemas/ReservationItem' } }
        notes: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        history:
          type: array
          description: Only on the detail endpoint.
          items:
            type: object
            properties:
              from_status: { type: string, nullable: true }
              to_status: { type: string }
              reason: { type: string, nullable: true }
              created_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer }
        reservation_id: { type: integer, nullable: true }
        type: { type: string, example: reservation_approved }
        message: { type: string }
        channel: { type: string, enum: [in_app, email] }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Message:
      type: object
      properties:
        id: { type: integer }
        from_user_id: { type: integer }
        branch_id: { type: integer, nullable: true }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [new, replied, closed] }
        created_at: { type: string, format: date-time }
    Ocr:
      type: object
      required: [ocr_text, confidence, ocr_status]
      properties:
        ocr_text: { type: string, nullable: true }
        confidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
        ocr_status: { $ref: '#/components/schemas/OcrStatus' }
        source: { type: string, enum: [tesseract, stub], description: The OCR engine that produced (or would have produced) the text. }
    Scan:
      allOf:
        - $ref: '#/components/schemas/Ocr'
        - type: object
          properties:
            matches: { type: array, items: { $ref: '#/components/schemas/Medicine' } }
    InventoryFeedXml:
      type: object
      xml: { name: inventoryFeed }
      description: Validated against docs/schemas/inventory-feed.xsd.
      required: [branchId, generatedAt, item]
      properties:
        branchId: { type: integer, minimum: 1, xml: { attribute: true } }
        generatedAt: { type: string, format: date-time, xml: { attribute: true } }
        item:
          type: array
          minItems: 1
          maxItems: 500
          xml: { name: item }
          items:
            type: object
            required: [genericName, brandName, strength, dosageForm, quantity, price, batchNo, expirationDate]
            properties:
              genericName: { type: string, maxLength: 150 }
              brandName: { type: string, maxLength: 100, description: May be empty (matches a medicine stored without a brand). }
              strength: { type: string, maxLength: 50 }
              dosageForm: { type: string, maxLength: 50 }
              quantity: { type: string, example: '120', description: 'A whole number from 0 to 1,000,000; judged per row.' }
              price: { type: string, example: '12.50', description: 'Greater than 0, at most 2 decimals; judged per row.' }
              batchNo: { type: string, maxLength: 50 }
              expirationDate: { type: string, format: date, description: Must be in the future; judged per row. }
              minThreshold: { type: integer, minimum: 0 }
    InventoryFeedJson:
      type: object
      required: [branch_id, generated_at, items]
      description: The same content as the XML feed, with snake_case names.
      properties:
        branch_id: { type: integer, minimum: 1 }
        generated_at: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [generic_name, brand_name, strength, dosage_form, quantity, price, batch_no, expiration_date]
            properties:
              generic_name: { type: string, maxLength: 150 }
              brand_name: { type: string, nullable: true, maxLength: 100 }
              strength: { type: string, maxLength: 50 }
              dosage_form: { type: string, maxLength: 50 }
              quantity: { oneOf: [{ type: integer }, { type: string }] }
              price: { oneOf: [{ type: number }, { type: string }] }
              batch_no: { type: string, nullable: true, maxLength: 50 }
              expiration_date: { type: string, format: date }
              min_threshold: { type: integer, nullable: true, minimum: 0 }
    FeedResult:
      type: object
      properties:
        accepted: { type: integer, description: Rows applied (including rows whose values did not change). }
        rejected: { type: integer }
        unchanged: { type: integer, description: 'Accepted rows that already had these values (no version bump, no stock movement).' }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer, description: 1-based position of the item in the feed. }
              code: { type: string, example: UNKNOWN_MEDICINE }
              message: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        components:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }

    # ---- success envelopes (Envelope + typed data)
    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token: { type: string }
                token_type: { type: string, example: Bearer }
                expires_in: { type: integer, example: 3600 }
                user: { $ref: '#/components/schemas/User' }
