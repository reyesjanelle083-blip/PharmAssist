# PharmAssist local stack: MySQL + gateway + four Laravel services + React dev client.
# Usage: see docs/RUNNING.md
x-laravel-env: &laravel-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?set APP_KEY in .env}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?set INTERNAL_SERVICE_KEY in .env}
  SESSION_DRIVER: file
  CACHE_STORE: file
  QUEUE_CONNECTION: sync

x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    container_name: pharmassist-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?set RESERVATION_DB_PASSWORD in .env}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?set INTEGRATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identity-service:
    <<: *service-base
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_PATH: services/identity-service
    environment:
      <<: *laravel-env
      SERVICE_NAME: identity-service
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 characters)}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Internal-Key: $$INTERNAL_SERVICE_KEY\" http://127.0.0.1:8000/internal/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory-service:
    <<: *service-base
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_PATH: services/inventory-service
    environment:
      <<: *laravel-env
      SERVICE_NAME: inventory-service
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Internal-Key: $$INTERNAL_SERVICE_KEY\" http://127.0.0.1:8000/internal/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  reservation-service:
    <<: *service-base
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_PATH: services/reservation-service
    environment:
      <<: *laravel-env
      SERVICE_NAME: reservation-service
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: reservation_db
      DB_USERNAME: reservation_user
      DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?set RESERVATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Internal-Key: $$INTERNAL_SERVICE_KEY\" http://127.0.0.1:8000/internal/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  integration-service:
    <<: *service-base
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_PATH: services/integration-service
        # Only this service needs the OCR engine (Tesseract + GD); the other images stay small.
        INSTALL_TESSERACT: "true"
    environment:
      <<: *laravel-env
      SERVICE_NAME: integration-service
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: integration_db
      DB_USERNAME: integration_user
      DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?set INTEGRATION_DB_PASSWORD in .env}
      INTEGRATION_MODE: ${INTEGRATION_MODE:-live}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_TIMEOUT_SECONDS: "${OSRM_TIMEOUT_SECONDS:-1.8}"
      OSRM_RETRIES: "${OSRM_RETRIES:-0}"
      OSRM_DEADLINE_SECONDS: "${OSRM_DEADLINE_SECONDS:-1.8}"
      HTTP_USER_AGENT: "${HTTP_USER_AGENT:-PharmAssistSIA/1.0 (replace with a contact email)}"
      HAVERSINE_ROAD_FACTOR: "${HAVERSINE_ROAD_FACTOR:-1.3}"
      HAVERSINE_AVG_SPEED_KMH: "${HAVERSINE_AVG_SPEED_KMH:-25}"
      DISTANCE_FORCE_FAIL: "${DISTANCE_FORCE_FAIL:-false}"
      OCR_PROVIDER: "${OCR_PROVIDER:-tesseract}"
      TESSERACT_BIN: "${TESSERACT_BIN:-tesseract}"
      OCR_PSM: "${OCR_PSM:-6}"
      OCR_TIMEOUT_SECONDS: "${OCR_TIMEOUT_SECONDS:-15}"
      OCR_MIN_CONFIDENCE: "${OCR_MIN_CONFIDENCE:-0.6}"
      OCR_MAX_CONCURRENT: "${OCR_MAX_CONCURRENT:-2}"
      OCR_FORCE_FAIL: "${OCR_FORCE_FAIL:-false}"
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Internal-Key: $$INTERNAL_SERVICE_KEY\" http://127.0.0.1:8000/internal/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_PATH: gateway
    environment:
      <<: *laravel-env
      SERVICE_NAME: gateway
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 characters)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GATEWAY_OCR_TIMEOUT_SECONDS: "${GATEWAY_OCR_TIMEOUT_SECONDS:-20}"
      IDENTITY_URL: http://identity-service:8000
      INVENTORY_URL: http://inventory-service:8000
      RESERVATION_URL: http://reservation-service:8000
      INTEGRATION_URL: http://integration-service:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      identity-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/internal/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Local development only (Vite dev server).
  client:
    build:
      context: ./client
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  mysql_data:
